<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ActPilot</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <header>
      <img id="logo" src="../icons/actpilot-logo-light.svg" alt="ActPilot" />
      <button id="downloadBtn" type="button" title="Download this chat as a PDF" hidden>Download chat</button>
    </header>

    <main id="messages"></main>

    <div id="suggestions">
      <button type="button" class="chip">Summarize this page</button>
      <button type="button" class="chip">Extract key information</button>
      <button type="button" class="chip">What are the pros and cons?</button>
      <button type="button" class="chip">Explain this in simple terms</button>
    </div>

    <div id="pageContext" hidden></div>

    <form id="chatForm">
      <textarea id="question" rows="2" placeholder="How can I help with this page?" required></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>

    <script src="sidebar.js"></script>
  </body>
</html>
